# URL guard: after every push to main, wait for the Vercel deploy, then check every URL Google knows
# (seo-data/url-baseline.json). Any NEW 404/410/5xx opens a GitHub issue labelled url-guard.
# Claude's routine must read open url-guard issues at the start of each session and fix them first.
name: url-guard
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * *"   # daily 6:00 AM Arizona
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  live-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Wait for Vercel deploy
        if: github.event_name == 'push'
        run: sleep 240
      - name: Check every baseline URL on production
        id: guard
        run: node scripts/url-guard.mjs prod | tee guard.txt
      - name: Open issue on new breaks
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('guard.txt') ? fs.readFileSync('guard.txt','utf8').slice(0, 60000) : 'guard failed to run';
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
              title: `URL GUARD: live URLs broken after ${context.sha.slice(0,7)}`,
              body: body + `\n\nCommit: ${context.sha}\nFix: add a 301 in next.config.mjs to the closest live page, or restore the page. Never leave a 404.`,
              labels: ['url-guard'] });
